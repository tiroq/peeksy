# Taskfile for Peeksy – build, commit, release, and publish to GitHub
# https://taskfile.dev
#
# Prerequisites:
#   - Go  ≥ 1.21                  (https://go.dev/dl)
#   - Task                        (brew install go-task/tap/go-task)
#   - Docker Desktop (running)    (https://www.docker.com/products/docker-desktop)
#   - fyne-cross                  (go install github.com/fyne-io/fyne-cross@latest)
#   - GitHub CLI (gh)             (brew install gh && gh auth login)
#
# ── Quick reference ────────────────────────────────────────────────────────────
#
#   task                    build for host OS/arch
#   task test               run all tests
#   task lint               go vet
#   task build:all          cross-compile all platforms via fyne-cross (requires Docker)
#
#   task commit MSG="..."   stage ALL changes & commit (required before release)
#   task release            auto-bump version, build all, publish GH release
#   task release -- minor   same but force minor bump
#   task release -- major   same but force major bump
#   task release:draft      same as release but creates a draft release
#
#   task clean              remove fyne-cross/ output and local binary

version: "3"

# ── Variables ──────────────────────────────────────────────────────────────────

vars:
  BINARY: peeksy
  MAIN: ./cmd/peeksy
  MODULE: github.com/tiroq/peeksy
  APP_ID: github.com.tiroq.peeksy
  FYNE_CROSS: "{{.HOME}}/go/bin/fyne-cross"

  # Next semver tag (e.g. v0.2.0) — computed by scripts/next-version.sh.
  # Pass an optional bump level via CLI_ARGS, e.g.: task release -- minor
  NEXT_TAG:
    sh: bash scripts/next-version.sh {{.CLI_ARGS}}

  # Version without leading 'v' for fyne/fyne-cross -app-version flag
  VERSION:
    sh: bash scripts/next-version.sh {{.CLI_ARGS}} | sed 's/^v//'

  # Short SHA for ldflags
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_DATE:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"

# ── Default ────────────────────────────────────────────────────────────────────

tasks:
  default:
    desc: Build peeksy for the current host platform
    cmds:
      - task: build

  # ── Build ──────────────────────────────────────────────────────────────────

  build:
    desc: Build peeksy for the current host platform
    cmds:
      - go build -ldflags "-s -w -X {{.MODULE}}/internal/version.Version={{.NEXT_TAG}} -X {{.MODULE}}/internal/version.Commit={{.COMMIT}} -X {{.MODULE}}/internal/version.BuildDate={{.BUILD_DATE}}" -o {{.BINARY}} {{.MAIN}}
    sources:
      - "**/*.go"
    generates:
      - "{{.BINARY}}"

  build:all:
    desc: Cross-compile for all platforms via fyne-cross (requires Docker)
    cmds:
      - task: build:linux
        vars: { VERSION: "{{.VERSION}}", NEXT_TAG: "{{.NEXT_TAG}}" }
      - task: build:windows
        vars: { VERSION: "{{.VERSION}}", NEXT_TAG: "{{.NEXT_TAG}}" }
      - task: build:darwin
        vars: { VERSION: "{{.VERSION}}", NEXT_TAG: "{{.NEXT_TAG}}" }
  build:linux:
    desc: Build for Linux amd64 + arm64 via fyne-cross (requires Docker)
    cmds:
      - "{{.FYNE_CROSS}} linux -arch=amd64,arm64 -app-id={{.APP_ID}} -app-version={{.VERSION}} -name={{.BINARY}} {{.MAIN}}"

  build:windows:
    desc: Build for Windows amd64 via fyne-cross (requires Docker)
    cmds:
      - "{{.FYNE_CROSS}} windows -arch=amd64 -app-id={{.APP_ID}} -app-version={{.VERSION}} -name={{.BINARY}} {{.MAIN}}"

  build:darwin:
    desc: Build for macOS amd64 + arm64 natively (requires Xcode CLT)
    cmds:
      - mkdir -p fyne-cross/dist/darwin-amd64 fyne-cross/dist/darwin-arm64
      - GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 go build
          -ldflags "-s -w -X {{.MODULE}}/internal/version.Version={{.NEXT_TAG}} -X {{.MODULE}}/internal/version.Commit={{.COMMIT}} -X {{.MODULE}}/internal/version.BuildDate={{.BUILD_DATE}}"
          -o fyne-cross/bin/darwin-amd64/{{.BINARY}} {{.MAIN}}
      - tar czf fyne-cross/dist/darwin-amd64/{{.BINARY}}-darwin-amd64.tar.gz
          -C fyne-cross/bin/darwin-amd64 {{.BINARY}}
      - GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build
          -ldflags "-s -w -X {{.MODULE}}/internal/version.Version={{.NEXT_TAG}} -X {{.MODULE}}/internal/version.Commit={{.COMMIT}} -X {{.MODULE}}/internal/version.BuildDate={{.BUILD_DATE}}"
          -o fyne-cross/bin/darwin-arm64/{{.BINARY}} {{.MAIN}}
      - tar czf fyne-cross/dist/darwin-arm64/{{.BINARY}}-darwin-arm64.tar.gz
          -C fyne-cross/bin/darwin-arm64 {{.BINARY}}

  # ── Test & Lint ────────────────────────────────────────────────────────────

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:verbose:
    desc: Run all tests with verbose output
    cmds:
      - go test -v ./...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Run go vet (and staticcheck if available)
    cmds:
      - go vet ./...
      - cmd: staticcheck ./...
        ignore_error: true

  tidy:
    desc: Tidy and verify go.mod / go.sum
    cmds:
      - go mod tidy
      - go mod verify

  # ── Commit ────────────────────────────────────────────────────────────────
  #
  # Agents call this before release to commit all pending work.
  # The commit message is passed as a variable (avoids Task's CLI_ARGS quoting):
  #
  #   task commit MSG="feat: add dark mode"
  #   task commit MSG="fix: repair null pointer"

  commit:
    desc: >-
      Stage ALL changes and create a git commit.
      Pass the message as: task commit MSG="type: your message"
    vars:
      MSG: '{{.MSG}}'
    preconditions:
      - sh: '[ -n "{{.MSG}}" ]'
        msg: "Commit message required. Usage: task commit MSG=\"type: your message\""
    cmds:
      - git add -A
      - git commit -m "{{.MSG}}"

  # ── Release ───────────────────────────────────────────────────────────────
  #
  # Fully automated release flow:
  #   1. Verify working tree is clean (no uncommitted changes)
  #   2. Compute next version from conventional commits since last tag
  #   3. Run tests
  #   4. Cross-compile all platforms (fyne-cross for Linux/Windows, native for Darwin)
  #   5. Create annotated git tag & push
  #   6. Create GitHub release with all artifacts
  #
  # Override bump level: task release -- minor | major | patch
  #
  # Agents should call `task commit` first, then `task release`.

  release:
    desc: >-
      Auto-bump version, cross-compile all platforms, and publish a GitHub release.
      Bump level is detected from conventional commits (patch / minor / major).
      Override: task release -- minor
    preconditions:
      - sh: "which gh"
        msg: "GitHub CLI (gh) is required. Install: brew install gh"
      - sh: "git diff --quiet && git diff --cached --quiet"
        msg: >-
          Working tree has uncommitted changes.
          Run: task commit MSG="type: your message"
    vars:
      TAG:
        sh: bash scripts/next-version.sh {{.CLI_ARGS}}
      VER:
        sh: bash scripts/next-version.sh {{.CLI_ARGS}} | sed 's/^v//'
    cmds:
      - task: test
      - task: build:all
        vars: { NEXT_TAG: "{{.TAG}}", VERSION: "{{.VER}}" }
      - task: _tag-and-push
        vars: { TAG: "{{.TAG}}" }
      - task: _gh-release
        vars: { TAG: "{{.TAG}}" }

  release:draft:
    desc: >-
      Same as `release` but publishes a draft GH release for review before going public.
      Override bump: task release:draft -- minor
    preconditions:
      - sh: "which gh"
        msg: "GitHub CLI (gh) is required. Install: brew install gh"
      - sh: "git diff --quiet && git diff --cached --quiet"
        msg: >-
          Working tree has uncommitted changes.
          Run: task commit MSG="type: your message"
    vars:
      TAG:
        sh: bash scripts/next-version.sh {{.CLI_ARGS}}
      VER:
        sh: bash scripts/next-version.sh {{.CLI_ARGS}} | sed 's/^v//'
    cmds:
      - task: test
      - task: build:all
        vars: { NEXT_TAG: "{{.TAG}}", VERSION: "{{.VER}}" }
      - task: _tag-and-push
        vars: { TAG: "{{.TAG}}" }
      - |
        gh release create {{.TAG}} \
          --title "Peeksy {{.TAG}}" \
          --generate-notes \
          --draft \
          fyne-cross/dist/linux-amd64/peeksy.tar.xz#peeksy-linux-amd64.tar.xz \
          fyne-cross/dist/linux-arm64/peeksy.tar.xz#peeksy-linux-arm64.tar.xz \
          fyne-cross/dist/windows-amd64/peeksy.zip#peeksy-windows-amd64.zip \
          fyne-cross/dist/darwin-amd64/peeksy-darwin-amd64.tar.gz#peeksy-darwin-amd64.tar.gz \
          fyne-cross/dist/darwin-arm64/peeksy-darwin-arm64.tar.gz#peeksy-darwin-arm64.tar.gz

  # ── Internal helpers ──────────────────────────────────────────────────────

  _tag-and-push:
    internal: true
    desc: Create an annotated git tag and push it with commits to origin
    cmds:
      - git tag -a {{.TAG}} -m "Release {{.TAG}}"
      - git push origin HEAD --follow-tags

  _gh-release:
    internal: true
    desc: Create public GitHub release and upload all platform archives
    cmds:
      - |
        gh release create {{.TAG}} \
          --title "Peeksy {{.TAG}}" \
          --generate-notes \
          fyne-cross/dist/linux-amd64/peeksy.tar.xz#peeksy-linux-amd64.tar.xz \
          fyne-cross/dist/linux-arm64/peeksy.tar.xz#peeksy-linux-arm64.tar.xz \
          fyne-cross/dist/windows-amd64/peeksy.zip#peeksy-windows-amd64.zip \
          fyne-cross/dist/darwin-amd64/peeksy-darwin-amd64.tar.gz#peeksy-darwin-amd64.tar.gz \
          fyne-cross/dist/darwin-arm64/peeksy-darwin-arm64.tar.gz#peeksy-darwin-arm64.tar.gz

  # ── Utilities ──────────────────────────────────────────────────────────────

  clean:
    desc: Remove fyne-cross/ build output and local binary
    cmds:
      - rm -rf fyne-cross/
      - rm -f {{.BINARY}}

  run:
    desc: Build and run peeksy locally
    cmds:
      - task: build
      - ./{{.BINARY}}

  version:
    desc: Print the next version that `task release` would create
    cmds:
      - bash scripts/next-version.sh {{.CLI_ARGS}}
