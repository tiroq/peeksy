# Taskfile for Peeksy – build, commit, release, and publish to GitHub
# https://taskfile.dev
#
# Prerequisites:
#   - Go  ≥ 1.21          (https://go.dev/dl)
#   - Task                (brew install go-task/tap/go-task)
#   - GitHub CLI (gh)     (brew install gh && gh auth login)
#
# ── Quick reference ────────────────────────────────────────────────────────────
#
#   task                    build for host OS/arch
#   task test               run all tests
#   task lint               go vet
#   task build:all          cross-compile → dist/
#
#   task commit             stage ALL changes & commit (required before release)
#   task release            auto-bump version, tag, build all, publish GH release
#   task release -- minor   same but force minor bump
#   task release -- major   same but force major bump
#   task release:draft      same as release but creates a draft release
#
#   task clean              remove dist/ and local binary

version: "3"

# ── Variables ──────────────────────────────────────────────────────────────────

vars:
  BINARY: peeksy
  MAIN: ./cmd/peeksy
  DIST: dist
  MODULE: github.com/tiroq/peeksy

  # Next semver tag — computed by scripts/next-version.sh.
  # Pass an optional bump level via CLI_ARGS, e.g.: task release -- minor
  NEXT_TAG:
    sh: bash scripts/next-version.sh {{.CLI_ARGS}}

  # Short SHA for ldflags
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_DATE:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"

  LDFLAGS: >-
    -s -w
    -X {{.MODULE}}/internal/version.Version={{.NEXT_TAG}}
    -X {{.MODULE}}/internal/version.Commit={{.COMMIT}}
    -X {{.MODULE}}/internal/version.BuildDate={{.BUILD_DATE}}

# ── Default ────────────────────────────────────────────────────────────────────

tasks:
  default:
    desc: Build peeksy for the current host platform
    cmds:
      - task: build

  # ── Build ──────────────────────────────────────────────────────────────────

  build:
    desc: Build peeksy for the current host platform
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BINARY}} {{.MAIN}}
    sources:
      - "**/*.go"
    generates:
      - "{{.BINARY}}"

  build:all:
    desc: Cross-compile peeksy for all supported platforms → dist/
    cmds:
      - task: build:linux-amd64
      - task: build:linux-arm64
      - task: build:darwin-amd64
      - task: build:darwin-arm64
      - task: build:windows-amd64

  build:linux-amd64:
    desc: Build for Linux/amd64
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    cmds:
      - mkdir -p {{.DIST}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/{{.BINARY}}-linux-amd64 {{.MAIN}}

  build:linux-arm64:
    desc: Build for Linux/arm64
    env:
      GOOS: linux
      GOARCH: arm64
      CGO_ENABLED: "0"
    cmds:
      - mkdir -p {{.DIST}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/{{.BINARY}}-linux-arm64 {{.MAIN}}

  build:darwin-amd64:
    desc: Build for macOS/amd64 (Intel)
    env:
      GOOS: darwin
      GOARCH: amd64
      CGO_ENABLED: "1"
    cmds:
      - mkdir -p {{.DIST}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/{{.BINARY}}-darwin-amd64 {{.MAIN}}

  build:darwin-arm64:
    desc: Build for macOS/arm64 (Apple Silicon)
    env:
      GOOS: darwin
      GOARCH: arm64
      CGO_ENABLED: "1"
    cmds:
      - mkdir -p {{.DIST}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/{{.BINARY}}-darwin-arm64 {{.MAIN}}

  build:windows-amd64:
    desc: Build for Windows/amd64
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"
    cmds:
      - mkdir -p {{.DIST}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/{{.BINARY}}-windows-amd64.exe {{.MAIN}}

  # ── Test & Lint ────────────────────────────────────────────────────────────

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:verbose:
    desc: Run all tests with verbose output
    cmds:
      - go test -v ./...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Run go vet (and staticcheck if available)
    cmds:
      - go vet ./...
      - cmd: staticcheck ./...
        ignore_error: true

  tidy:
    desc: Tidy and verify go.mod / go.sum
    cmds:
      - go mod tidy
      - go mod verify

  # ── Commit ────────────────────────────────────────────────────────────────
  #
  # Agents call this before release to commit all pending work.
  # The commit message is passed as a variable (avoids Task's CLI_ARGS quoting):
  #
  #   task commit MSG="feat: add dark mode"
  #   task commit MSG="fix: repair null pointer"

  commit:
    desc: >-
      Stage ALL changes and create a git commit.
      Pass the message as: task commit MSG="type: your message"
    vars:
      MSG: '{{.MSG}}'
    preconditions:
      - sh: '[ -n "{{.MSG}}" ]'
        msg: "Commit message required. Usage: task commit MSG=\"type: your message\""
    cmds:
      - git add -A
      - git commit -m "{{.MSG}}"

  # ── Release ───────────────────────────────────────────────────────────────
  #
  # Fully automated release flow:
  #   1. Verify working tree is clean (no uncommitted changes)
  #   2. Compute next version from conventional commits since last tag
  #   3. Run tests
  #   4. Cross-compile all platforms
  #   5. Archive binaries
  #   6. Create annotated git tag & push
  #   7. Create GitHub release with assets
  #
  # Override bump level: task release -- minor | major | patch
  #
  # Agents should call `task commit` first, then `task release`.

  release:
    desc: >-
      Auto-bump version, cross-compile all platforms, and publish a GitHub release.
      Bump level is detected from conventional commits (patch / minor / major).
      Override: task release -- minor
    preconditions:
      - sh: "which gh"
        msg: "GitHub CLI (gh) is required. Install: brew install gh"
      - sh: "git diff --quiet && git diff --cached --quiet"
        msg: >-
          Working tree has uncommitted changes.
          Run: task commit -- "type: your message"
    vars:
      TAG:
        sh: bash scripts/next-version.sh {{.CLI_ARGS}}
    cmds:
      - task: test
      - task: build:all
        vars: { NEXT_TAG: "{{.TAG}}" }
      - task: _archive
        vars: { TAG: "{{.TAG}}" }
      - task: _tag-and-push
        vars: { TAG: "{{.TAG}}" }
      - task: _gh-release
        vars: { TAG: "{{.TAG}}" }

  release:draft:
    desc: >-
      Same as `release` but publishes a draft GH release for review before going public.
      Override bump: task release:draft -- minor
    preconditions:
      - sh: "which gh"
        msg: "GitHub CLI (gh) is required. Install: brew install gh"
      - sh: "git diff --quiet && git diff --cached --quiet"
        msg: >-
          Working tree has uncommitted changes.
          Run: task commit -- "type: your message"
    vars:
      TAG:
        sh: bash scripts/next-version.sh {{.CLI_ARGS}}
    cmds:
      - task: test
      - task: build:all
        vars: { NEXT_TAG: "{{.TAG}}" }
      - task: _archive
        vars: { TAG: "{{.TAG}}" }
      - task: _tag-and-push
        vars: { TAG: "{{.TAG}}" }
      - |
        gh release create {{.TAG}} \
          --title "Peeksy {{.TAG}}" \
          --generate-notes \
          --draft \
          {{.DIST}}/peeksy-linux-amd64-{{.TAG}}.tar.gz \
          {{.DIST}}/peeksy-linux-arm64-{{.TAG}}.tar.gz \
          {{.DIST}}/peeksy-darwin-amd64-{{.TAG}}.tar.gz \
          {{.DIST}}/peeksy-darwin-arm64-{{.TAG}}.tar.gz \
          {{.DIST}}/peeksy-windows-amd64-{{.TAG}}.zip

  # ── Internal helpers ──────────────────────────────────────────────────────

  _archive:
    internal: true
    desc: Compress dist/ binaries into release archives
    cmds:
      - |
        cd {{.DIST}}
        for bin in peeksy-linux-amd64 peeksy-linux-arm64 \
                   peeksy-darwin-amd64 peeksy-darwin-arm64; do
          tar czf "${bin}-{{.TAG}}.tar.gz" "${bin}"
        done
        zip peeksy-windows-amd64-{{.TAG}}.zip peeksy-windows-amd64.exe

  _tag-and-push:
    internal: true
    desc: Create an annotated git tag and push it with commits to origin
    cmds:
      - git tag -a {{.TAG}} -m "Release {{.TAG}}"
      - git push origin HEAD --follow-tags

  _gh-release:
    internal: true
    desc: Create public GitHub release and upload archives
    cmds:
      - |
        gh release create {{.TAG}} \
          --title "Peeksy {{.TAG}}" \
          --generate-notes \
          {{.DIST}}/peeksy-linux-amd64-{{.TAG}}.tar.gz \
          {{.DIST}}/peeksy-linux-arm64-{{.TAG}}.tar.gz \
          {{.DIST}}/peeksy-darwin-amd64-{{.TAG}}.tar.gz \
          {{.DIST}}/peeksy-darwin-arm64-{{.TAG}}.tar.gz \
          {{.DIST}}/peeksy-windows-amd64-{{.TAG}}.zip

  # ── Utilities ──────────────────────────────────────────────────────────────

  clean:
    desc: Remove dist/ directory and local binary
    cmds:
      - rm -rf {{.DIST}}
      - rm -f {{.BINARY}}

  run:
    desc: Build and run peeksy locally
    cmds:
      - task: build
      - ./{{.BINARY}}

  version:
    desc: Print the next version that `task release` would create
    cmds:
      - bash scripts/next-version.sh {{.CLI_ARGS}}
